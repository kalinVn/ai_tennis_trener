name: tennis-ai-coach-prod

services:
  client:
    profiles: ["application"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.client
    restart: always
    depends_on:
      api:
        condition: service_started
    networks:
      - backend

  admin:
    profiles: ["application"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    restart: always
    depends_on:
      api:
        condition: service_started
    networks:
      - backend

  api:
    profiles: ["application"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  postgres-prod-data:
