<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · Tennis AI Coach</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .auth-static-page{min-height:100vh;display:flex;flex-direction:column}
    .auth-static-main{flex:1;display:grid;place-items:center;padding:60px 0 80px}
    .auth-static-card{width:min(460px,100%);padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:24px}
    .auth-static-card h1{font-size:clamp(36px,8vw,52px);margin-bottom:10px}
    .auth-static-intro{margin-bottom:24px}
    .auth-static-card .btn{width:100%}
    .auth-static-divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .auth-static-divider::before,.auth-static-divider::after{content:"";height:1px;flex:1;background:var(--border)}
    .auth-static-socials{display:grid;gap:10px}
    .auth-static-socials .btn{gap:10px}
    .auth-static-socials svg{width:20px;height:20px;flex:0 0 20px}
    .auth-static-switch{margin:22px 0 0;text-align:center;font-size:14px}
    .auth-static-switch a{color:var(--accent);font-weight:700}
    @media(max-width:530px){.auth-static-main{padding:30px 0 50px}.auth-static-card{padding:24px 18px}}
  </style>
</head>
<body>
  <div id="app">
    <div class="auth-static-page">
      <nav class="public-nav"><div class="container nav-inner">
        <a class="brand" href="index.html"><span class="logo">AI</span>Tennis AI Coach</a>
        <div class="nav-links"><a href="index.html">Home</a><a href="features.html">Features</a><a href="training.html">Training</a><a href="pricing.html">Pricing</a></div>
        <div class="nav-actions"><a class="btn primary small" href="register.html">Start free</a></div>
      </div></nav>
      <main class="auth-static-main container">
        <section class="auth-static-card" aria-labelledby="login-title-static">
          <div class="eyebrow">Welcome back</div>
          <h1 id="login-title-static">Login</h1>
          <p class="auth-static-intro">Sign in to continue to your tennis workspace.</p>
          <form onsubmit="event.preventDefault()">
            <div class="field">
              <label for="login-email-static">Email</label>
              <input id="login-email-static" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
              <label for="login-password-static">Password</label>
              <input id="login-password-static" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
            <button class="btn primary" type="submit">Login</button>
          </form>
          <div class="auth-static-divider"><span>or continue with</span></div>
          <div class="auth-static-socials" aria-label="Social login options">
            <button class="btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10.1 10.1 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.9V7.4H3.1a10 10 0 0 0 0 9.2L6.5 14Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.9 1.5l2.9-2.8A9.8 9.8 0 0 0 3.1 7.4l3.4 2.7A5.9 5.9 0 0 1 12 6Z"/></svg>
              Login with Google
            </button>
            <button class="btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.1A12 12 0 1 0 10.1 24v-8.4h-3v-3.5h3V9.5c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9v2.2h3.4l-.5 3.5h-2.9V24A12 12 0 0 0 24 12.1Z"/></svg>
              Login with Facebook
            </button>
            <button class="btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.1 12.7c0-2.7 2.2-4 2.3-4.1a5 5 0 0 0-3.9-2.1c-1.7-.2-3.2 1-4.1 1s-2.1-1-3.5-.9a5.2 5.2 0 0 0-4.4 2.7c-1.9 3.3-.5 8.1 1.3 10.7.9 1.3 2 2.7 3.4 2.6 1.3-.1 1.9-.9 3.5-.9s2.1.9 3.6.8c1.5 0 2.4-1.3 3.3-2.6a11.6 11.6 0 0 0 1.5-3.1 4.7 4.7 0 0 1-3-4.1ZM14.4 4.8A4.8 4.8 0 0 0 15.5 1a4.9 4.9 0 0 0-3.3 1.8A4.6 4.6 0 0 0 11 6.4a4 4 0 0 0 3.4-1.6Z"/></svg>
              Login with Apple
            </button>
          </div>
          <p class="auth-static-switch">New to Tennis AI Coach? <a href="register.html">Create Account</a></p>
        </section>
      </main>
      <footer class="public-footer"><div class="container footer-row"><span>© Tennis AI Coach · visual prototype</span><span>Privacy · Terms · Support</span></div></footer>
    </div>
  </div>
  <script type="module" src="../../login/main.js"></script>
</body>
</html>
