<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account · Tennis AI Coach</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .auth-static-page{min-height:100vh;display:flex;flex-direction:column}
    .auth-static-main{flex:1;display:grid;place-items:center;padding:60px 0 80px}
    .auth-static-card{width:min(620px,100%);padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:24px}
    .auth-static-card h1{font-size:clamp(36px,8vw,52px);margin-bottom:10px}
    .auth-static-intro{margin-bottom:24px}
    .auth-static-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .auth-static-grid .field{margin:0}
    .auth-static-wide{grid-column:1/-1}
    .auth-static-agreement{display:flex;align-items:flex-start;gap:11px;color:var(--text);font-size:13px}
    .auth-static-agreement input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--accent)}
    .auth-static-submit{width:100%;margin-top:22px}
    .auth-static-switch{margin:22px 0 0;text-align:center;font-size:14px}
    .auth-static-switch a{color:var(--accent);font-weight:700}
    @media(max-width:620px){.auth-static-main{padding:30px 0 50px}.auth-static-card{padding:24px 18px}.auth-static-grid{grid-template-columns:1fr}.auth-static-wide{grid-column:auto}}
  </style>
</head>
<body>
  <div id="app">
    <div class="auth-static-page">
      <nav class="public-nav"><div class="container nav-inner">
        <a class="brand" href="index.html"><span class="logo">AI</span>Tennis AI Coach</a>
        <div class="nav-links"><a href="index.html">Home</a><a href="features.html">Features</a><a href="training.html">Training</a><a href="pricing.html">Pricing</a></div>
        <div class="nav-actions"><a class="btn small" href="login.html">Login</a></div>
      </div></nav>
      <main class="auth-static-main container">
        <section class="auth-static-card" aria-labelledby="register-title-static">
          <div class="eyebrow">Start free</div>
          <h1 id="register-title-static">Create Account</h1>
          <p class="auth-static-intro">Create your Tennis AI Coach profile.</p>
          <form onsubmit="event.preventDefault()">
            <div class="auth-static-grid">
              <div class="field">
                <label for="register-first-name-static">First name</label>
                <input id="register-first-name-static" name="first_name" type="text" autocomplete="given-name" placeholder="First name" required>
              </div>
              <div class="field">
                <label for="register-last-name-static">Surname</label>
                <input id="register-last-name-static" name="last_name" type="text" autocomplete="family-name" placeholder="Surname" required>
              </div>
              <div class="field auth-static-wide">
                <label for="register-email-static">Email</label>
                <input id="register-email-static" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
              </div>
              <div class="field auth-static-wide">
                <label for="register-phone-static">Phone</label>
                <input id="register-phone-static" name="phone" type="tel" autocomplete="tel" placeholder="+359 88 123 4567" required>
              </div>
              <div class="field">
                <label for="register-password-static">Password</label>
                <input id="register-password-static" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="12" required>
              </div>
              <div class="field">
                <label for="register-confirm-password-static">Confirm password</label>
                <input id="register-confirm-password-static" name="confirm_password" type="password" autocomplete="new-password" placeholder="Repeat your password" minlength="12" required>
              </div>
              <label class="auth-static-agreement auth-static-wide" for="register-agreement-static">
                <input id="register-agreement-static" name="agreement" type="checkbox" required>
                <span>I agree to the Terms of Service and Privacy Policy.</span>
              </label>
            </div>
            <button class="btn primary auth-static-submit" type="submit">Create Account</button>
          </form>
          <p class="auth-static-switch">Already have an account? <a href="login.html">Login</a></p>
        </section>
      </main>
      <footer class="public-footer"><div class="container footer-row"><span>© Tennis AI Coach · visual prototype</span><span>Privacy · Terms · Support</span></div></footer>
    </div>
  </div>
  <script type="module" src="../../register/main.js"></script>
</body>
</html>
