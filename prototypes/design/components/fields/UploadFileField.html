<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload File Field</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 32px 24px; background: #07100c; }
    .field { width: min(360px, 100%); margin: 0; }
    /* Upload-field-only presentation; the native input remains keyboard accessible. */
    .upload-field { position: relative; }
    .upload-field__title { font-size: 13px; font-weight: 400; color: var(--muted); }
    .field.upload-field input.upload-field__input[type="file"] {
      position: absolute;
      width: 1px;
      max-width: 1px;
      height: 1px;
      min-height: 0;
      padding: 0;
      margin: -1px;
      border: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .upload-field .upload-field__choose {
      justify-self: start;
      min-height: 51px;
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .upload-field__icon { width: 20px; height: 20px; flex: 0 0 20px; }
    .upload-field__input:focus-visible + .upload-field__choose { outline: 2px solid var(--accent2); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .upload-field__choose { transition: none; } }
  </style>
</head>
<body>
  <div class="field upload-field">
                  <span class="upload-field__title" id="upload-file-title">Upload file</span>
                  <input class="upload-field__input" id="upload-file" type="file" aria-labelledby="upload-file-title upload-file-choose">
                  <label class="btn upload-field__choose" for="upload-file">
                    <svg class="upload-field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 13V3m-4 4 4-4 4 4M3 12v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>
                    <span id="upload-file-choose">Choose File</span>
                  </label>
                </div>
</body>
</html>
