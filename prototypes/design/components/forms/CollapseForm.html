<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collapse Form</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body { padding: 32px 24px; background: #07100c; }
    .collapse-form { max-width: 1100px; margin: auto; }
/* Container styles from Profile's Tennis Profile section. */
.collapse-form {
  box-sizing: border-box;
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 22px;
  background: #0d1913;
  color: #f4f7f5;
  font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.collapse-form__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 23px 25px;
  cursor: pointer;
  list-style: none;
}
.collapse-form__header::-webkit-details-marker { display: none; }
.collapse-form__header:focus-visible { outline: 2px solid #65e8ff; outline-offset: -3px; }
.collapse-form__heading { min-width: 0; overflow-wrap: anywhere; }
.collapse-form__title { margin: 0 0 5px; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: 0; }
.collapse-form__description { margin: 0; color: #a8b5ae; font-size: 13px; }
.collapse-form__icon { color: #b7ff4a; font-size: 25px; flex: 0 0 auto; }
.collapse-form__icon::before { content: '+'; }
.collapse-form[open] > .collapse-form__header .collapse-form__icon::before { content: '−'; }
.collapse-form__body { border-top: 1px solid rgba(255, 255, 255, .12); padding: 23px 25px 25px; }
.collapse-form__footer { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; margin-top: 9px; }
.collapse-form__footer .btn { min-height: 51px; max-width: 100%; white-space: normal; }
@media (max-width: 1100px) {
  .collapse-form__header { min-height: 44px; }
  .collapse-form__icon { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; font-size: 30px; line-height: 1; }
}
@media (max-width: 720px) {
  .collapse-form__header { padding: 18px; }
  .collapse-form__body { padding: 20px 18px; }
  .collapse-form__title { font-size: 18px; }
}
  </style>
</head>
<body>
  <details class="collapse-form" open>
    <summary class="collapse-form__header">
      <div class="collapse-form__heading">
        <h2 class="collapse-form__title">Tennis Profile</h2>
        <p class="collapse-form__description">Information that helps adapt tennis-specific guidance.</p>
      </div>
      <span class="collapse-form__icon" aria-hidden="true"></span>
    </summary>
    <div class="collapse-form__body">
      <!-- Sample parent-owned content; the Vue container supplies slots instead. -->
      <div class="profile-grid form-grid">
            <div class="field"><label for="level">Playing level</label><select id="level" name="playing_level"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option><option>Competitive</option></select></div>
            <div class="field"><label for="experience">Playing experience</label><select id="experience" name="playing_experience"><option value="">Not specified</option><option value="under-1">Under 1 year</option><option value="1-3">1–3 years</option><option value="3-5">3–5 years</option><option value="5-10">5–10 years</option><option value="10-plus">10+ years</option></select></div>
            <div class="field"><label for="hand">Dominant hand</label><select id="hand" name="dominant_hand"><option value="">Not specified</option><option>Right</option><option>Left</option></select></div>
            <div class="field"><label for="backhand">Backhand</label><select id="backhand" name="backhand_style"><option value="">Not specified</option><option>One-handed</option><option>Two-handed</option></select></div>
            <div class="field"><label for="play-style">Playing style</label><select id="play-style" name="playing_style"><option value="">Not specified</option><option>Aggressive baseliner</option><option>Defensive baseliner</option><option>All-court</option><option>Serve and volley</option><option>Still exploring</option></select></div>
            <div class="field"><label for="surface">Preferred court surface</label><select id="surface" name="preferred_surface"><option value="">No preference</option><option>Hard court</option><option>Clay</option><option>Grass</option><option>Other</option></select></div>
            <div class="field"><label for="favorite-stroke">Favorite stroke</label><select id="favorite-stroke" name="favorite_stroke"><option value="">Not specified</option><option>Forehand</option><option>Backhand</option><option>Serve</option><option>Volley</option></select></div>
            <div class="field"><label for="training-frequency">Typical training frequency</label><select id="training-frequency" name="typical_training_frequency"><option value="">Not specified</option><option value="1">Once a week</option><option value="2">Twice a week</option><option value="3">Three times a week</option><option value="4+">Four or more times</option></select></div>
          </div>
          <h3>Training Goals</h3><p>What you want the AI coach to help you improve.</p>
          <div class="profile-grid form-grid">
            <div class="field"><label for="main-goal">Primary goal</label><select id="main-goal" name="primary_goal"><option>Improve technique</option><option>Better footwork</option><option>Better consistency</option><option>Increase accuracy</option><option>Prepare for matches</option><option>General fitness</option></select></div>
            <div class="field"><label for="training-time">Preferred session length</label><select id="training-time" name="preferred_session_minutes"><option value="">Not specified</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div>
            <div class="field wide"><label>Strokes and skills to improve</label><div class="flex">
              <label class="profile-check"><input type="checkbox" name="focus_strokes" value="forehand" checked>Forehand</label>
              <label class="profile-check"><input type="checkbox" name="focus_strokes" value="backhand">Backhand</label>
              <label class="profile-check"><input type="checkbox" name="focus_strokes" value="serve">Serve</label>
              <label class="profile-check"><input type="checkbox" name="focus_strokes" value="volley">Volley</label>
              <label class="profile-check"><input type="checkbox" name="focus_strokes" value="footwork" checked>Footwork</label>
            </div></div>
            <div class="field wide"><label for="goal-notes">Your training goal (optional)</label><textarea id="goal-notes" name="goal_notes" maxlength="500" placeholder="Describe what you would like to achieve"></textarea></div>
          </div>
      <div class="collapse-form__footer">
        <button class="btn primary" type="button">Save Changes</button>
        <button class="btn ghost" type="button">Reset Changes</button>
      </div>
    </div>
  </details>
</body>
</html>
