<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Plan Card</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body { display: grid; place-items: center; box-sizing: border-box; min-height: 100vh; padding: 32px 24px; background: #07100c; }
    .payment-plan-card { width: min(680px, 100%); }
/* Visual values from the Subscription page's Performance plan panel. */
.payment-plan-card {
  box-sizing: border-box;
  min-width: 0;
  padding: 22px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 22px;
  background: #0d1913;
  color: #f4f7f5;
  font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-wrap: anywhere;
}
.payment-plan-card__status {
  box-sizing: border-box;
  display: inline-block;
  border-radius: 100px;
  background: #244029;
  color: #b7ff4a;
  padding: 5px 11px;
  font-size: 12px;
}
.payment-plan-card__name, .payment-plan-card__price {
  font-size: clamp(29px, 4vw, 43px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.03em;
  margin: 0 0 12px;
}
.payment-plan-card__name { margin-top: 16px; }
.payment-plan-card__features { list-style: none; padding: 0; margin: 0 0 16px; color: #a8b5ae; }
.payment-plan-card__price { color: #b7ff4a; }
.payment-plan-card__period { color: #a8b5ae; font-size: 16px; }
  </style>
</head>
<body>
  <article class="payment-plan-card">
    <span class="payment-plan-card__status">Active · demo</span>
    <h2 class="payment-plan-card__name">Performance plan</h2>
    <ul class="payment-plan-card__features">
      <li>Realtime coaching, richer insights and progress tools.</li>
    </ul>
    <h2 class="payment-plan-card__price">€19 <span class="payment-plan-card__period">/ month (example)</span></h2>
    <button class="btn primary" type="button">Change plan</button>
  </article>
</body>
</html>
