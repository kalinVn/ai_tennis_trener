<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Modal Design · Tennis AI Coach</title><link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px}.camera-reference{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:var(--bg);color:var(--text)}
.camera-reference[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.camera-head,.camera-foot{padding:16px 25px;background:#08140e;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.camera-head{border-bottom:1px solid var(--border)}.camera-foot{border-top:1px solid var(--border)}.camera-video{position:relative;min-height:0;display:grid;place-items:center;background:radial-gradient(circle at 45% 35%,#345340,#0b1c14 65%)}.camera-foot .muted{flex:1}
</style></head><body><button class="btn primary" id="open-camera">Open camera modal design</button>
<dialog class="camera-reference" id="camera-reference" aria-labelledby="camera-title"><header class="camera-head"><span class="brand" id="camera-title"><span class="logo">AI</span>Live Training</span><span class="spacer"></span><span class="pill">CAMERA + MICROPHONE</span></header><div class="camera-video"><div class="video-label">Live camera preview · visual reference</div></div><footer class="camera-foot"><span class="muted">Design reference only · no devices connected</span><button class="btn" type="button" disabled>Mute microphone</button><button class="btn primary" type="button" disabled>Start Video Analysis</button><button class="btn" type="button" id="close-camera">Return to Training</button></footer></dialog>
<script>const modal=document.getElementById('camera-reference');document.getElementById('open-camera').onclick=()=>modal.showModal();document.getElementById('close-camera').onclick=()=>modal.close();modal.showModal();</script></body></html>
